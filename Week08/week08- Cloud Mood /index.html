<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Silvia Cloud Mood Archive</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <main class="container">

    <p class="label">SILVIA CLOUD ARCHIVE</p>

    <h1>How is Silvia Cloud feeling today?</h1>

    <p class="intro">
      Click the button to discover a different mood.
    </p>

    <section class="mood-card">

      <div id="mood-emoji" class="cloud">
        ☁️
      </div>

      <h2 id="mood-name"></h2>

      <p id="mood-description"></p>

      <button id="next">
        Next Mood →
      </button>

    </section>

    <p id="counter"></p>

  </main>

</body>

</html>
